[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = printable, esp32_exception_decoder

lib_deps =
  bodmer/TFT_eSPI

build_flags =
  -I../shared

  -D USER_SETUP_LOADED=1

  -D ST7789_DRIVER=1

  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320

  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_CS=5
  -D TFT_DC=2
  -D TFT_RST=4

  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1

  -D SPI_FREQUENCY=27000000